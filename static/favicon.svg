<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="neu-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#b8bec7" flood-opacity="0.9"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="neu-inset">
      <feComposite in="SourceGraphic"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8edf4"/>
      <stop offset="100%" style="stop-color:#d8dde6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="1" y="1" width="62" height="62" rx="14" ry="14"
        fill="url(#bg-grad)"
        filter="url(#neu-drop)"/>

  <!-- Antenna tower pole -->
  <line x1="28" y1="14" x2="28" y2="50"
        stroke="#9aa5b4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Crossbars (top to bottom, tapering) -->
  <line x1="16" y1="18" x2="40" y2="18"
        stroke="#9aa5b4" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="23" x2="38" y2="23"
        stroke="#9aa5b4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="28" x2="36" y2="28"
        stroke="#9aa5b4" stroke-width="2" stroke-linecap="round"/>

  <!-- Diagonal guy wires -->
  <line x1="28" y1="32" x2="14" y2="48"
        stroke="#9aa5b4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28" y1="32" x2="42" y2="48"
        stroke="#9aa5b4" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Wifi symbol (top right) -->
  <path d="M 46 10 Q 52 10 56 14" stroke="#9aa5b4" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 47.5 13 Q 51.5 13 54.5 16" stroke="#9aa5b4" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="51" cy="19" r="1.8" fill="#9aa5b4"/>

  <!-- Gear (bottom right of pole) -->
  <circle cx="43" cy="42" r="5" stroke="#9aa5b4" stroke-width="2" fill="none"/>
  <circle cx="43" cy="42" r="2" fill="#9aa5b4"/>
  <line x1="43" y1="36" x2="43" y2="37.5" stroke="#9aa5b4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="43" y1="46.5" x2="43" y2="48" stroke="#9aa5b4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="37" y1="42" x2="38.5" y2="42" stroke="#9aa5b4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="47.5" y1="42" x2="49" y2="42" stroke="#9aa5b4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="38.8" y1="38.8" x2="39.8" y2="39.8" stroke="#9aa5b4" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="46.2" y1="45.2" x2="47.2" y2="46.2" stroke="#9aa5b4" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="46.2" y1="38.8" x2="47.2" y2="37.8" stroke="#9aa5b4" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="38.8" y1="45.2" x2="37.8" y2="46.2" stroke="#9aa5b4" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Meter / dial needle (bottom center) -->
  <path d="M 16 58 Q 22 50 28 52" stroke="#9aa5b4" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <line x1="22" y1="56" x2="30" y2="50"
        stroke="#9aa5b4" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="22" cy="56" r="2" fill="#9aa5b4"/>
</svg>
