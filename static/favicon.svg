<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: deep navy, high contrast -->
  <rect width="64" height="64" rx="12" fill="#1a2e55"/>

  <!-- Left antenna vertical element -->
  <line x1="18" y1="6" x2="18" y2="26" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Left antenna top crossbar (dipole) -->
  <line x1="10" y1="6" x2="26" y2="6" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Right antenna vertical element -->
  <line x1="46" y1="6" x2="46" y2="26" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Right antenna top crossbar (dipole) -->
  <line x1="38" y1="6" x2="54" y2="6" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Horizontal bus connecting both antenna feeds -->
  <line x1="18" y1="26" x2="46" y2="26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center feedline down to switch node -->
  <line x1="32" y1="26" x2="32" y2="38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Switch node -->
  <circle cx="32" cy="40" r="3.5" fill="#4a6cf7" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Switch arm — angled to left antenna (active) -->
  <line x1="32" y1="40" x2="19" y2="50" stroke="#4a6cf7" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Switch pivot dot (bottom of arm) -->
  <circle cx="20" cy="51" r="2.5" fill="#ffffff"/>

  <!-- Feedline from switch down to radio connector -->
  <line x1="32" y1="56" x2="32" y2="44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Radio connector tick -->
  <line x1="26" y1="57" x2="38" y2="57" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
